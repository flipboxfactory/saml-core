name: ci

on:
  push:
    branches:
      - v4
  pull_request:
    branches:
      - v4

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Craft 4 supports PHP 8.0.2+
        php: ['8.0', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, openssl, zip, zlib
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Coding standards
        run: vendor/bin/phpcs --standard=psr2 src/containers/Saml2Container.php src/helpers/SecurityHelper.php
      - name: Tests
        run: composer test
