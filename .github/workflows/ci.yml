name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, intl, mbstring, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: ECS
        run: composer check-cs
      - name: PHPStan
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 resolves simplesamlphp/saml2 4.19.x; 8.3+ resolves 4.20.x
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saml_core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CRAFT_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=saml_core_test
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, openssl, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Show resolved saml2 version
        run: composer show simplesamlphp/saml2 | grep -E '^versions'
      - name: Run tests
        run: |
          cp tests/.env.example tests/.env
          composer test
