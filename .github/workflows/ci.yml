name: ci

on:
  push:
    branches:
      - master
      - 'craft/*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master run: it may be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Pint
        run: composer check-cs
      - name: PHPStan
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: saml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'saml_test' }}
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, mbstring, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run tests
        run: composer test

  # Releases from the conventional-commit PR titles merged since the latest tag (see .github/scripts/version.sh).
  # Releases from master and the craft/X.Y maintenance branches. The release commit is pushed by the release
  # GitHub App, which may bypass the branch rulesets.
  release:
    name: Tag & release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/craft/'))
    needs: [checks, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/version.sh plan
      - name: Get a release app token
        id: app
        if: steps.plan.outputs.version != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit, tag and release ${{ steps.plan.outputs.version }}
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: .github/scripts/version.sh release "${{ steps.plan.outputs.version }}"
